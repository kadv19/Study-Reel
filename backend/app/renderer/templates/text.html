{% extends "base.html" %}

{% block content %}
<div class="flex flex-col justify-between h-full py-4 max-w-[960px] mx-auto w-full">
  
  <!-- Slide Header -->
  <div class="space-y-4">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-md bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 font-mono text-xs uppercase tracking-wider">
      <span>Key Concept</span>
    </div>
    <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white leading-tight break-word-safe">
      {{ slide.header }}
    </h1>
  </div>

  <!-- Body Content Card -->
  <div class="my-auto py-6">
    <div class="glass-card-glow rounded-2xl p-10 relative overflow-hidden">
      <div class="absolute top-0 left-0 w-2 h-full bg-gradient-to-b from-cyan-400 via-indigo-500 to-emerald-400"></div>
      
      <!-- Belt-and-braces: wrapped at ~28 chars/line equivalent width, with line-clamp-6 and safe overflow handling -->
      <p class="text-2xl sm:text-3xl text-slate-100 font-medium leading-relaxed max-w-[760px] break-word-safe line-clamp-6">
        {{ slide.body }}
      </p>

      {% if slide.caption %}
      <div class="mt-6 pt-4 border-t border-slate-700/60 flex items-center gap-2 text-slate-400 text-base font-normal">
        <span class="text-cyan-400">💡</span>
        <span class="break-word-safe line-clamp-2">{{ slide.caption }}</span>
      </div>
      {% endif %}
    </div>
  </div>

  <!-- Pro Tip / Context Pill -->
  <div class="flex items-center gap-3 p-4 rounded-xl bg-slate-900/60 border border-slate-800 text-slate-300 text-sm">
    <div class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></div>
    <span class="font-mono text-xs uppercase text-slate-400 tracking-wider">Takeaway:</span>
    <span class="text-slate-200 truncate">Master fundamentals to build scalable engineering intuition.</span>
  </div>

</div>
{% endblock %}
