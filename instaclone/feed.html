<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyReel Feed • InstaClone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand-title">
      <span class="brand-logo">&#10022;</span>
      <span>StudyReel</span>
    </div>
    <div class="live-badge">
      <span class="live-dot"></span>
      <span>Live Feed</span>
    </div>
  </header>

  <main class="feed-container" id="feed-container">
    <div class="empty-state">
      <div class="empty-icon">&#128247;</div>
      <h3>Loading Feed...</h3>
      <p style="color:var(--text-muted); margin-top:8px;">Connecting to InstaClone API on port 8100...</p>
    </div>
  </main>

  <script src="/static/feed.js"></script>
</body>
</html>
